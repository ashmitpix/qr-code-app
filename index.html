<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.76.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.76.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["qrcode", "pillow"],
          entrypoint: "app.py",
          files: {
            "app.py": [
              "import streamlit as st",
              "import qrcode",
              "from io import BytesIO",
              "",
              "st.markdown('''",
              "<style>",
              "#MainMenu {visibility: hidden;}",
              "footer {visibility: hidden;}",
              "header {visibility: hidden;}",
              "</style>",
              "''', unsafe_allow_html=True)",
              "",
              "st.title('QR Code Generator')",
              "st.write('Enter a website URL or text below to generate a downloadable QR code.')",
              "",
              "user_input = st.text_input('Website URL or Text:', placeholder='https://example.com')",
              "",
              "if st.button('Generate QR Code'):",
              "    if user_input:",
              "        qr = qrcode.QRCode(version=1, box_size=10, border=4)",
              "        qr.add_data(user_input)",
              "        qr.make(fit=True)",
              "        img = qr.make_image(fill_color='black', back_color='white')",
              "        buffer = BytesIO()",
              "        img.save(buffer, format='PNG')",
              "        buffer.seek(0)",
              "        st.image(buffer, caption='Your Generated QR Code', width=250)",
              "        st.download_button(label='Download PNG', data=buffer.getvalue(), file_name='qrcode.png', mime='image/png')",
              "    else:",
              "        st.warning('Please enter some text or a URL first!')"
            ].join("\n")
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
